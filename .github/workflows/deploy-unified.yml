name: Deploy Portfolio (Unified)

on:
  push:
    branches:
      - main
      - dev
  # Refresh baked shop snapshot periodically (runtime also fetches live boplog)
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout main branch to isolated directory
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: temp/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # boplog data/ = SSOT for shop project facts (baked snapshot at build; live fetch at runtime)
      - name: Checkout boplog data
        uses: actions/checkout@v4
        with:
          repository: kvnloo/boplog
          sparse-checkout: data
          sparse-checkout-cone-mode: true
          path: boplog-src

      # Build main branch content to deploy root
      - name: Build main (production)
        env:
          BOPLOG_DATA_DIR: ${{ github.workspace }}/boplog-src/data
        run: |
          mkdir -p deploy

          # Copy main content to deploy root
          cp temp/main/index.html deploy/

          # Copy all content directories
          for dir in ai-engineering mobile-development frontend-development devops-systems assets demos work lab oss shared; do
            if [ -d "temp/main/$dir" ]; then
              cp -r "temp/main/$dir" deploy/
            fi
          done

          # Copy config files if they exist
          [ -f "temp/main/README.md" ] && cp temp/main/README.md deploy/
          [ -f "temp/main/_config.yml" ] && cp temp/main/_config.yml deploy/
          [ -f "temp/main/Gemfile" ] && cp temp/main/Gemfile deploy/

          # Build interactive demos (Kevin's Ramen & Boba)
          # prebuild → sync-shop-from-boplog (uses BOPLOG_DATA_DIR); runtime upgrades via live fetch
          if [ -d "temp/main/demos/room" ]; then
            (cd temp/main/demos/room && npm ci && npm run build)
            mkdir -p deploy/demos/room
            cp -r temp/main/demos/room/dist/. deploy/demos/room/
          fi
          if [ -d "temp/main/demos/spline" ]; then
            (cd temp/main/demos/spline && npm ci && npm run build)
            mkdir -p deploy/demos/spline
            cp -r temp/main/demos/spline/dist/. deploy/demos/spline/
          fi

          # Add .nojekyll to prevent Jekyll processing
          touch deploy/.nojekyll

          echo "✅ Main branch built to deploy/"
          ls -la deploy/
          ls -la deploy/demos 2>/dev/null || true

      # Checkout dev branch to isolated directory
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: temp/dev

      # Build dev branch content to deploy/dev subdirectory
      - name: Build dev
        env:
          BOPLOG_DATA_DIR: ${{ github.workspace }}/boplog-src/data
        run: |
          mkdir -p deploy/dev

          # Copy dev content to deploy/dev subdirectory
          cp temp/dev/index.html deploy/dev/

          # Copy all content directories to dev subdirectory
          for dir in ai-engineering mobile-development frontend-development devops-systems assets demos work lab oss shared; do
            if [ -d "temp/dev/$dir" ]; then
              cp -r "temp/dev/$dir" deploy/dev/
            fi
          done

          # Copy config files if they exist
          [ -f "temp/dev/README.md" ] && cp temp/dev/README.md deploy/dev/
          [ -f "temp/dev/_config.yml" ] && cp temp/dev/_config.yml deploy/dev/
          [ -f "temp/dev/Gemfile" ] && cp temp/dev/Gemfile deploy/dev/

          # Build demos for dev preview (prefer dev when present so previews stay current)
          if [ -d "temp/dev/demos/room" ]; then
            (cd temp/dev/demos/room && npm ci && npm run build)
            mkdir -p deploy/demos/room deploy/dev/demos/room
            cp -r temp/dev/demos/room/dist/. deploy/demos/room/
            cp -r temp/dev/demos/room/dist/. deploy/dev/demos/room/
          fi
          if [ -d "temp/dev/demos/spline" ]; then
            (cd temp/dev/demos/spline && npm ci && npm run build)
            mkdir -p deploy/demos/spline deploy/dev/demos/spline
            cp -r temp/dev/demos/spline/dist/. deploy/demos/spline/
            cp -r temp/dev/demos/spline/dist/. deploy/dev/demos/spline/
          fi

          echo "✅ Dev branch built to deploy/dev/"
          ls -la deploy/dev/

      # Verify final directory structure
      - name: Verify deployment structure
        run: |
          echo "📦 Final deployment structure:"
          tree -L 2 deploy/ || find deploy/ -maxdepth 2 -type d

          echo ""
          echo "📊 Deployment summary:"
          echo "  Main content: $(find deploy/ -maxdepth 1 -type f | wc -l) files"
          echo "  Dev content:  $(find deploy/dev/ -type f 2>/dev/null | wc -l) files"

          # Verify critical files exist
          [ -f "deploy/index.html" ] && echo "✅ Main index.html exists" || echo "❌ Main index.html MISSING"
          [ -f "deploy/dev/index.html" ] && echo "✅ Dev index.html exists" || echo "❌ Dev index.html MISSING"
          [ -f "deploy/.nojekyll" ] && echo "✅ .nojekyll exists" || echo "❌ .nojekyll MISSING"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment complete
        run: |
          echo "✅ Portfolio deployed successfully!"
          echo ""
          echo "📍 URLs:"
          echo "  Production: https://kvnloo.github.io/portfolio/"
          echo "  Dev:        https://kvnloo.github.io/portfolio/dev/"
          echo ""
          echo "🔗 Deployment URL: ${{ steps.deployment.outputs.page_url }}"
